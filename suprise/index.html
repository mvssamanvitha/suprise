<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff2f7">
  <meta name="description" content="A little Spider-Man-inspired world, made with love.">
  <title>A Little World for You</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body class="opening-page">
  <main class="opening-screen">
    <div class="opening-wash" aria-hidden="true"></div>
    <div class="web-curtain web-curtain--left" aria-hidden="true"></div>
    <div class="web-curtain web-curtain--right" aria-hidden="true"></div>

    <div class="opening-content">
      <div class="opening-copy">
        <p class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span> A tiny world made for you</p>
        <h1>Ready to swing<br>into <span>something sweet?</span></h1>
        <p class="opening-note">Your own little corner of the web is waiting.</p>
        <a class="enter-button" href="home.html">
          <span>Come on in</span>
          <span class="button-arrow" aria-hidden="true">&#8594;</span>
        </a>
        <p class="button-hint">Tap to open your surprise</p>
      </div>

      <div class="character-scene" aria-hidden="true">
        <span class="scene-spark scene-spark--one">&#10022;</span>
        <span class="scene-spark scene-spark--two">&#10022;</span>
        <span class="scene-heart">&#9829;</span>
        <div class="character-shadow"></div>
        <div class="hero-character">
          <div class="hero-web"></div>
          <div class="character-arm character-arm--left"></div>
          <div class="character-arm character-arm--right"></div>
          <div class="character-body">
            <div class="suit-panel suit-panel--left"></div>
            <div class="suit-panel suit-panel--right"></div>
            <div class="chest-mark">&#9829;</div>
          </div>
          <div class="character-neck"></div>
          <div class="character-head">
            <div class="mask-web"></div>
            <span class="character-eye character-eye--left"></span>
            <span class="character-eye character-eye--right"></span>
          </div>
          <div class="character-leg character-leg--left"></div>
          <div class="character-leg character-leg--right"></div>
        </div>
        <span class="scene-caption">your friendly neighbourhood sweetheart</span>
      </div>
    </div>

    <div class="opening-footer" aria-hidden="true">
      <span class="footer-line"></span>
      <span>made with a little extra love</span>
      <span class="footer-line"></span>
    </div>
  </main>
</body>
</html>
