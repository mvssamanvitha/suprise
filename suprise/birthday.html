<!doctype html>
<html lang="en">
<head>

  <link rel="stylesheet" href="css/hug.css?v=2">
  <link rel="stylesheet" href="css/birthday.css">

</head>
<body class="birthday-page">
  <main class="hug-stage birthday-stage" tabindex="0" aria-label="Return to the main website">
    <span class="hug-web hug-web--top" aria-hidden="true"></span>
    <span class="hug-web hug-web--bottom" aria-hidden="true"></span>
    <span class="hug-decoration hug-decoration--heart-one" aria-hidden="true">&#10084;</span>
    <span class="hug-decoration hug-decoration--heart-two" aria-hidden="true">&#9829;</span>
    <span class="hug-decoration hug-decoration--spark-one" aria-hidden="true">&#10022;</span>
    <span class="hug-decoration hug-decoration--spark-two" aria-hidden="true">&#10022;</span>

    <section class="birthday-content" aria-labelledby="birthday-title">
      <h1 id="birthday-title">Advance Happieee<br><span>Birthday, My Lovee!</span> <span class="birthday-title-emoji" aria-hidden="true">&#x1F382;&#x2764;&#xFE0F;&#x1F979;</span></h1>

        <span class="cake-candle"></span>
        <span class="cake-flame"></span>
        <div class="cake-tier cake-tier--top"><span class="cake-web"></span><i>&#10084;</i></div>
        <div class="cake-tier cake-tier--bottom"><span class="cake-icing"></span></div>
        <div class="cake-plate"></div>

        <span class="cake-spark cake-spark--two">&#10022;</span>
      </div>
    </section>
