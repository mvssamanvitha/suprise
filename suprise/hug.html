<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff2f7">
  <meta name="description" content="A warm virtual hug, made just for you.">
  <title>Happiee Boyfriend's Dayy Babyy</title>
  <link rel="stylesheet" href="css/hug.css?v=4">
  <script src="js/hug.js?v=2" defer></script>
</head>
<body class="hug-page">
  <main class="hug-stage" tabindex="0" aria-label="Continue to the birthday page">
    <span class="hug-web hug-web--top" aria-hidden="true"></span>
    <span class="hug-web hug-web--bottom" aria-hidden="true"></span>
    <span class="hug-decoration hug-decoration--heart-one" aria-hidden="true">&#10084;</span>
    <span class="hug-decoration hug-decoration--heart-two" aria-hidden="true">&#9829;</span>
    <span class="hug-decoration hug-decoration--spark-one" aria-hidden="true">&#10022;</span>
    <span class="hug-decoration hug-decoration--spark-two" aria-hidden="true">&#10022;</span>

    <section class="hug-content" aria-labelledby="hug-title">
      <h1 id="hug-title">Happiee Boyfriend's<br><span>Dayy Babyy</span> <span class="hug-title-heart" aria-hidden="true">&#x2764;&#xFE0F;&#x1FAC2;</span></h1>
      <div class="hug-scene" aria-label="Two little heroes ready to hug">
        <span class="hug-scene-spark hug-scene-spark--one" aria-hidden="true">&#10022;</span>
        <span class="hug-scene-spark hug-scene-spark--two" aria-hidden="true">&#10022;</span>
        <div class="hug-person hug-person--left" aria-hidden="true">
          <span class="person-head"><i></i><i></i></span>
          <span class="person-body"><b></b></span>
          <span class="person-arm person-arm--outer"></span>
          <span class="person-arm person-arm--inner"></span>
          <span class="person-leg person-leg--left"></span>
          <span class="person-leg person-leg--right"></span>
        </div>
        <div class="hug-person hug-person--right" aria-hidden="true">
          <span class="person-head"><i></i><i></i></span>
          <span class="person-body"><b></b></span>
          <span class="person-arm person-arm--outer"></span>
          <span class="person-arm person-arm--inner"></span>
          <span class="person-leg person-leg--left"></span>
          <span class="person-leg person-leg--right"></span>
        </div>
        <span class="hug-contact-heart" aria-hidden="true">&#10084;</span>
      </div>
      <button class="hug-button birthday-navigation-button" type="button">Chotuu Suprisee <span aria-hidden="true">&#x1F381;&#x2764;&#xFE0F;</span></button>
    </section>
  </main>
</body>
</html>
